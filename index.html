<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paris veille, nous aussi. — Visualisez l'OpenData au clair de lune</title>
  <meta name="description" content="Explorez les lieux d'accueil et les services sociaux qui restent ouverts quand la ville s'endort. Défi Apside OpenData & Nuit.">
  <meta name="theme-color" content="#080C16">

  <!-- Polices Google : Inter et JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Feuille de styles Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <div id="app">
    <!-- 1. Top Navbar -->
    <header class="top-navbar" id="top-navbar" role="banner"></header>

    <!-- 2. Hero Header Section -->
    <section class="hero-section" id="hero-section" role="region" aria-label="Présentation"></section>

    <!-- 3. KPI Metric Cards (4 Colonnes) -->
    <section class="kpi-grid" id="kpi-grid" role="region" aria-label="Indicateurs clés"></section>

    <!-- 4. Live Map Card (Carte nocturne & filtres) -->
    <section class="map-card" id="map-card" role="region" aria-label="Carte interactive"></section>

    <!-- 5. Rythme de la Nuit (Visualisation courbe d'activité nocturne) -->
    <section class="rythme-card" id="rythme-card" role="region" aria-label="Activité nocturne"></section>

    <!-- 6. Bottom 2-Column Grid (Répartition Donut & Centres Actifs Maintenant) -->
    <section class="bottom-grid" id="bottom-grid" role="region" aria-label="Détail des structures"></section>

    <!-- 7. Footer -->
    <footer class="footer-row" id="footer" role="contentinfo"></footer>

    <!-- Fiche détaillée coulissante (Bottom Sheet / Modal) -->
    <aside id="bottom-sheet" role="complementary" aria-label="Détail de l'établissement" aria-hidden="true"></aside>

    <!-- Canvas de l'Easter Egg « Clair de Lune » -->
    <canvas id="easter-egg-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- Point d'entrée script modulaire Vite -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
